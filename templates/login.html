
<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Popup</title>
</head>
<style>
  body, html {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }
  
  .overlay {
    background-color: rgba(0,0,0,0.5);
    background: url("{% static 'imgs/treehm.jpeg' %}");
    background-size: cover;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .login-box {
    background-color:  #7C8B52;
    padding: 2rem;
    border-radius: 15px;
    width: 300px;
    position: relative;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    text-align: center;
  }
  
  .close-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
  }
  
  h2 {
    margin-bottom: 1.5rem;
    color: darkred;
  }
  
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 10px;
    margin-left: -8px;
    border-radius: 30px;
    border: none;
    margin-bottom: 1rem;
    font-size: 1rem;
  }
  
  .password-field {
    position: relative;
  }
  
  .toggle-password {
    position: absolute;
    left: 90%;
    top: 9px;
    cursor: pointer;
  }
  
  .forgot {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
    color: black;
    text-decoration: none;
  }
  
  .login-btn {
    background-color: #385e16;
    color: white;
    padding: 10px 20px;
    border: none;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 1rem;
  }
  
  .signup-btn {
    background-color: white;
    border: 2px solid #385e16;
    color: #385e16;
    padding: 8px 20px;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    margin-bottom: 1rem;
  }
  
  .user-icon {
    margin-left: 5px;
  }
  
  .login-with {
    margin: 0.5rem 0;
    font-size: 0.9rem;
  }
  
  .social-icons a img {
    margin: 0 10px;
    height: 24px;
  }
  
</style>
<body>

<div class="overlay">
  <div class="login-box">
    <form>
      <button class="close-btn" type="button">&times;</button>
    
    <h2>LogIn</h2>
    <input type="text" placeholder="Email or User name" required />
    <div class="password-field">
      <input type="password" placeholder="Password" id="password" required />
      <span class="toggle-password" id="togglePassword">👁️</span>
    </div>
    <a href="#" class="forgot">Forget Password ?</a>
    <button type="submit" class="login-btn">LOGIN</button>
    <button type="button" class="signup-btn" onclick="location.href='Signup.html'">
      SIGN UP <span class="user-icon">👤</span>
    </button>
    
   
    <p class="login-with">Login With</p>
    <div class="social-icons">
      <a href="#"><img src="https://img.icons8.com/ios-filled/30/instagram-new.png"/></a>
      <a href="#"><img src="https://img.icons8.com/ios-filled/30/facebook.png"/></a>
      <a href="#"><img src="https://img.icons8.com/ios-filled/30/google-logo.png"/></a>
    </div>
  </div>
</form>
</div>
<script>
  const togglePassword = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');

  togglePassword.addEventListener('click', () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    
    // Toggle icon (you can replace this with SVGs if you'd like)
    togglePassword.textContent = type === 'password' ? '👁️' : '⛔';
  });
</script>


</body>
</html>
